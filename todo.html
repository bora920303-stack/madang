<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MADANG | Team Workspace</title><link rel="stylesheet" href="./todo.css"></head><body><header><a href="./index.html">← HOME</a><h1>Team Workspace</h1><nav><a href="#tasks">TO DO</a><a href="#team">TEAM</a><a href="#board">BOARD</a></nav></header><main><section id="auth"><h2>로그인 / 회원가입</h2><form id="authForm"><input id="email" type="email" placeholder="이메일" required><input id="password" type="password" minlength="6" placeholder="비밀번호" required><button value="signin">로그인</button><button value="signup">회원가입</button></form><button id="logout" hidden>로그아웃</button><p id="userInfo"></p></section><div id="workspace" hidden><section id="team"><h2>GROUP (TEAM)</h2><form id="createTeam"><input id="teamName" placeholder="새 팀 이름" required maxlength="80"><button>팀 만들기</button></form><form id="joinTeam"><input id="inviteCode" placeholder="팀 초대 코드" required><button>팀 가입</button></form><label>현재 팀 <select id="teamSelect"></select></label><p id="teamCode"></p></section><section id="tasks"><h2>TO DO List</h2><form id="taskForm"><input id="taskTitle" placeholder="새 할 일" maxlength="200" required><button>추가</button></form><div class="columns"><div><h3>Will Be</h3><div id="will"></div></div><div><h3>Done</h3><div id="done"></div></div></div></section><section id="board"><h2>TEAM 게시판</h2><form id="postForm"><input id="postTitle" placeholder="제목" maxlength="150" required><textarea id="postBody" placeholder="팀원에게 공유할 내용" required></textarea><button>글 등록</button></form><div id="posts"></div></section></div><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./todo.js"></script></body></html>
